name: android-emulator
# The phone as a zone (tools/android-endpoint.py) on pull requests that touch the app's player or
# what it speaks with the node, so such a change can't break it unnoticed until a release (it did:
# 0.2.0 and 0.2.1 shipped with this check red). One Android version, an x86_64 APK signed with a
# throwaway key; the release workflow runs the same check on four versions with the signed APK.
on:
  pull_request:
    paths:
      - crates/pm-desktop/**
      - crates/pm-endpoint/**
      - crates/pm-stream/**
      - crates/pm-out-net/**
      # The node's side: registration and keys (pm-api), the zones, the binary
      - crates/pm-api/**
      - crates/pm-zones/**
      - crates/pm-node/**
      - Cargo.toml
      - Cargo.lock
      - tools/android-endpoint.py
      - tools/release/android-patch.py
      # The player service and the crash report the check asserts on
      - tools/release/android/**
      - .github/workflows/android-emulator.yml
  workflow_dispatch:
concurrency:
  group: android-emulator-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
jobs:
  phone-as-zone:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 17
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: x86_64-linux-android
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            crates/pm-desktop
            .
          key: android-emulator
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
      # As in release.yml: gen/android is not committed
      - name: generate the Android project
        working-directory: crates/pm-desktop
        run: |
          echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          export NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          npm ci --no-audit --no-fund
          npx tauri android init --ci --skip-targets-install
          npx tauri icon ../pm-api/static/icon.svg
          python3 -I ../../tools/release/android-patch.py .
      - name: build the APK (x86_64, for the emulator)
        working-directory: crates/pm-desktop
        run: npx tauri android build --ci --apk --target x86_64
      - name: sign it with a throwaway key
        run: |
          apk=$(find crates/pm-desktop/gen/android/app/build/outputs/apk -name '*release*.apk' | head -1)
          test -n "$apk" || { find crates/pm-desktop/gen/android/app/build/outputs -type f; exit 1; }
          bt=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          keytool -genkeypair -keystore "$RUNNER_TEMP/ci.p12" -storetype PKCS12 -storepass ci-only -keypass ci-only \
            -alias ci -keyalg RSA -keysize 2048 -validity 30 -dname "CN=android-emulator CI"
          "$bt/zipalign" -f 4 "$apk" "$RUNNER_TEMP/aligned.apk"
          "$bt/apksigner" sign --ks "$RUNNER_TEMP/ci.p12" --ks-pass pass:ci-only --out app.apk "$RUNNER_TEMP/aligned.apk"
      - name: build the node
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev
          cargo build --locked -p pm-node
      - name: enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: the phone as a zone
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        env:
          QEMU_AUDIO_DRV: none
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim -camera-back none
          disable-animations: true
          script: python3 -I tools/android-endpoint.py app.apk target/debug/pm-node /tmp/ae
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-emulator
          path: |
            /tmp/ae/*.png
            /tmp/ae/*.txt
            /tmp/ae/*.log
          if-no-files-found: ignore
