name: android-update
# The Android app updating itself (tools/android-update-probe.py): two x86_64 builds with the
# `update-feed-fixture` feature, N (versionCode 1000) and N+1 (1001), signed with one throwaway
# key; a feed on the runner offers N+1. A tampered download must not install; the right one must
# install over N from inside the app and keep its data. Android 15 and 17 (17 on the google_atd
# image: the google_apis 37 images crash-loop on the runners, see android-ring-transport.yml).
# Also checks that the .aab is built without the updater.
on:
  pull_request:
    paths:
      - crates/pm-desktop/**
      - tools/android-update-probe.py
      - tools/release/android-patch.py
      - tools/release/android/**
      - tools/release/updater-manifest.py
      - .github/workflows/android-update.yml
  workflow_dispatch:
concurrency:
  group: android-update-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        working-directory: crates/pm-desktop
    env:
      ODEION_UPDATE_CHANNEL: edge
      ODEION_UPDATE_FEED: http://127.0.0.1:18480/latest.json
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/pm-desktop
          key: android-update
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: generate the Android project
        run: |
          echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          export NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          npm ci --no-audit --no-fund
          npx tauri android init --ci --skip-targets-install
          npx tauri icon ../pm-api/static/icon.svg
          python3 -I ../../tools/release/android-patch.py .
      - name: build N and N+1 (x86_64, with the fixture feed)
        run: |
          mkdir -p "$GITHUB_WORKSPACE/update"
          for build in "1000 0.0.1-1 old" "1001 0.0.1-2 new"; do
            read -r code version name <<< "$build"
            echo "{\"version\":\"$version\",\"bundle\":{\"android\":{\"versionCode\":$code}}}" > update.conf.json
            npx tauri android build --ci --apk --target x86_64 --features update-feed-fixture --config update.conf.json
            apk=$(find gen/android/app/build/outputs/apk -name '*release*.apk' | head -1)
            test -n "$apk" || { find gen/android/app/build/outputs -type f; exit 1; }
            cp "$apk" "$RUNNER_TEMP/$name-unsigned.apk"
          done
      - name: sign both with one throwaway key
        run: |
          bt=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          keytool -genkeypair -keystore "$RUNNER_TEMP/ci.p12" -storetype PKCS12 -storepass ci-only -keypass ci-only \
            -alias ci -keyalg RSA -keysize 2048 -validity 30 -dname "CN=android-update CI"
          for name in old new; do
            "$bt/zipalign" -f 4 "$RUNNER_TEMP/$name-unsigned.apk" "$RUNNER_TEMP/$name-aligned.apk"
            "$bt/apksigner" sign --ks "$RUNNER_TEMP/ci.p12" --ks-pass pass:ci-only \
              --out "$GITHUB_WORKSPACE/update/$name.apk" "$RUNNER_TEMP/$name-aligned.apk"
          done
          "$bt/aapt2" dump badging "$GITHUB_WORKSPACE/update/old.apk" | grep -E "^package|REQUEST_INSTALL_PACKAGES"
          "$bt/aapt2" dump badging "$GITHUB_WORKSPACE/update/new.apk" | grep -E "^package"
      # As release.yml builds it: the APKs have the updater, the .aab has none.
      - name: the .aab has no updater
        run: |
          python3 -I ../../tools/release/android-patch.py . --without-updater
          npx tauri android build --ci --aab --target x86_64 --features update-feed-fixture --config update.conf.json
          aab=$(find gen/android/app/build/outputs/bundle -name '*release*.aab' | head -1)
          test -n "$aab"
          unzip -p "$aab" base/manifest/AndroidManifest.xml > "$RUNNER_TEMP/aab-manifest.pb"
          if grep -a -q REQUEST_INSTALL_PACKAGES "$RUNNER_TEMP/aab-manifest.pb"; then
            echo "::error::the .aab asks for REQUEST_INSTALL_PACKAGES"; exit 1
          fi
          grep -a -q android.permission.INTERNET "$RUNNER_TEMP/aab-manifest.pb" || { echo "::error::cannot read the .aab manifest"; exit 1; }
          if unzip -p "$aab" 'base/dex/*.dex' | grep -a -q 'pubkymusic/AppUpdate'; then
            echo "::error::the .aab has the AppUpdate class"; exit 1
          fi
          unzip -p "$GITHUB_WORKSPACE/update/old.apk" '*.dex' | grep -a -q 'pubkymusic/AppUpdate' \
            || { echo "::error::the APK has no AppUpdate class: this check cannot see it"; exit 1; }
          echo "the .aab has neither REQUEST_INSTALL_PACKAGES nor AppUpdate"
      - uses: actions/upload-artifact@v7
        with:
          name: update-apks
          path: update/
          retention-days: 3

  probe:
    needs: build
    name: update (API ${{ matrix.api }}, ${{ matrix.target }})
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - {api: "35", target: google_apis}
          - {api: "37.0", target: google_atd}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: update-apks
          path: update
      - name: enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: the app updates itself
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: ${{ matrix.target }}
          ram-size: 6144M
          disk-size: 8192M
          cores: 4
          emulator-boot-timeout: 1500
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim -camera-back none -no-audio
          disable-animations: true
          script: python3 -I tools/android-update-probe.py update/old.apk update/new.apk /tmp/up ${{ matrix.target == 'google_atd' && '--settings-optional' || '' }}
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: update-probe-api${{ matrix.api }}-${{ matrix.target }}
          path: /tmp/up/
          if-no-files-found: ignore
