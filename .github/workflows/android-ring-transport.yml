name: android-ring-transport
# The Pubky Ring sign-in transport inside the app (tools/android-ring-probe.py): an x86_64 APK
# built with the `ring-transport-probe` feature routes a fixture grant exchange (signed cached
# PKARR packet, direct endpoint refused, ICANN endpoint on the runner) and a lookup of a public
# homeserver through the app's own TLS verifier, on the oldest and newest Android the app
# targets. The phone-as-zone check (android-emulator.yml) never signs in with Ring.
on:
  pull_request:
    paths:
      - crates/pm-desktop/**
      - crates/pm-pubky/**
      - tools/android-ring-probe.py
      - tools/release/android-patch.py
      - .github/workflows/android-ring-transport.yml
  workflow_dispatch:
concurrency:
  group: android-ring-transport-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 17
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: x86_64-linux-android
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: crates/pm-desktop
          key: android-ring-transport
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
      # A CA and a localhost certificate for this run only: the fixture homeserver's ICANN endpoint.
      - name: fixture certificate
        run: |
          d="$RUNNER_TEMP/fixture"; mkdir -p "$d"; cd "$d"
          openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:P-256 -nodes -days 2 \
            -subj "/CN=ring-probe fixture CA" -keyout ca.key -out ca.pem \
            -addext basicConstraints=critical,CA:TRUE -addext keyUsage=critical,keyCertSign,cRLSign
          openssl req -newkey ec -pkeyopt ec_paramgen_curve:P-256 -nodes -subj "/CN=localhost" \
            -keyout leaf.key -out leaf.csr
          printf 'subjectAltName=DNS:localhost\nbasicConstraints=critical,CA:FALSE\nextendedKeyUsage=serverAuth\n' > ext.cnf
          openssl x509 -req -in leaf.csr -CA ca.pem -CAkey ca.key -CAcreateserial -days 2 -extfile ext.cnf -out leaf.pem
          rm ca.key leaf.csr
          echo "RING_PROBE_CA=$d/ca.pem" >> "$GITHUB_ENV"
      - name: generate the Android project
        working-directory: crates/pm-desktop
        run: |
          echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          export NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          npm ci --no-audit --no-fund
          npx tauri android init --ci --skip-targets-install
          npx tauri icon ../pm-api/static/icon.svg
          python3 -I ../../tools/release/android-patch.py .
      - name: build the APK (x86_64, with the probe)
        working-directory: crates/pm-desktop
        run: npx tauri android build --ci --apk --target x86_64 --features ring-transport-probe
      - name: sign it with a throwaway key
        run: |
          apk=$(find crates/pm-desktop/gen/android/app/build/outputs/apk -name '*release*.apk' | head -1)
          test -n "$apk" || { find crates/pm-desktop/gen/android/app/build/outputs -type f; exit 1; }
          bt=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          keytool -genkeypair -keystore "$RUNNER_TEMP/ci.p12" -storetype PKCS12 -storepass ci-only -keypass ci-only \
            -alias ci -keyalg RSA -keysize 2048 -validity 30 -dname "CN=android-ring-transport CI"
          "$bt/zipalign" -f 4 "$apk" "$RUNNER_TEMP/aligned.apk"
          "$bt/apksigner" sign --ks "$RUNNER_TEMP/ci.p12" --ks-pass pass:ci-only --out app.apk "$RUNNER_TEMP/aligned.apk"
          mkdir -p probe && mv app.apk probe/ && cp "$RUNNER_TEMP"/fixture/{ca.pem,leaf.pem,leaf.key} probe/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ring-probe-apk
          path: probe/
          retention-days: 3

  probe:
    needs: build
    name: ring transport (API ${{ matrix.api }}, ${{ matrix.target }})
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        # 30: the oldest the release check covers; 35; 37.0: Android 17, where the app's
        # target (API 37) turns on certificate transparency and local-network protection.
        # Android 17 runs on the google_atd image: on the runners the google_apis 37.0 and 37.1
        # images crash-loop surfaceflinger (SIGABRT in RegionSampling) every ~20 s, which
        # restarts system_server, so installs and launches fail (run 41896087891).
        include:
          - {api: "30", target: google_apis}
          - {api: "35", target: google_apis}
          - {api: "37.0", target: google_atd}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ring-probe-apk
          path: probe
      - name: enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: the Ring transport in the app
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: ${{ matrix.target }}
          ram-size: 6144M
          # The API 37 image's default data partition cannot take the x86_64 APK.
          disk-size: 8192M
          cores: 4
          emulator-boot-timeout: 1500
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim -camera-back none -no-audio
          disable-animations: true
          script: python3 -I tools/android-ring-probe.py probe/app.apk probe /tmp/rp
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ring-probe-api${{ matrix.api }}-${{ matrix.target }}
          path: /tmp/rp/
          if-no-files-found: ignore
