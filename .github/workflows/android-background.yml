name: android-background
# Does the Android app keep playing in the background? (tools/android-background-probe.py,
# TASK-android-background-playback-1105.) An x86_64 APK, a node on the runner, the phone's own
# zone and the in-app player each sent to the background on an emulator. Run by hand while the
# cause is found; on pull requests that touch the app's Android side afterwards.
on:
  pull_request:
    paths:
      - crates/pm-desktop/**
      - tools/release/android/**
      - tools/release/android-patch.py
      - tools/android-background-probe.py
      - tools/android-endpoint.py
      - .github/workflows/android-background.yml
  workflow_dispatch:
concurrency:
  group: android-background-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 17
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: x86_64-linux-android
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            crates/pm-desktop
            .
          key: android-background
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
      - name: generate the Android project
        working-directory: crates/pm-desktop
        run: |
          echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          export NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          npm ci --no-audit --no-fund
          npx tauri android init --ci --skip-targets-install
          npx tauri icon ../pm-api/static/icon.svg
          python3 -I ../../tools/release/android-patch.py .
      - name: build the APK (x86_64)
        working-directory: crates/pm-desktop
        run: npx tauri android build --ci --apk --target x86_64
      - name: sign it with a throwaway key
        run: |
          apk=$(find crates/pm-desktop/gen/android/app/build/outputs/apk -name '*release*.apk' | head -1)
          test -n "$apk" || { find crates/pm-desktop/gen/android/app/build/outputs -type f; exit 1; }
          bt=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          keytool -genkeypair -keystore "$RUNNER_TEMP/ci.p12" -storetype PKCS12 -storepass ci-only -keypass ci-only \
            -alias ci -keyalg RSA -keysize 2048 -validity 30 -dname "CN=android-background CI"
          "$bt/zipalign" -f 4 "$apk" "$RUNNER_TEMP/aligned.apk"
          "$bt/apksigner" sign --ks "$RUNNER_TEMP/ci.p12" --ks-pass pass:ci-only --out app.apk "$RUNNER_TEMP/aligned.apk"
          mkdir -p probe && mv app.apk probe/
      - name: build the node
        run: cargo build -p pm-node && cp target/debug/pm-node probe/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: background-probe
          path: probe/
          retention-days: 3

  probe:
    needs: build
    name: background playback (API ${{ matrix.api }}, ${{ matrix.target }})
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - {api: "30", target: google_apis}
          - {api: "35", target: google_apis}
          # Android 17 on the google_atd image (the google_apis 37 images crash-loop on the runners,
          # see android-ring-transport.yml); its default data partition can't take the APK
          - {api: "37.0", target: google_atd}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: background-probe
          path: probe
      - name: enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: the app in the background
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: ${{ matrix.target }}
          ram-size: 6144M
          disk-size: 8192M
          cores: 4
          emulator-boot-timeout: 1500
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim -camera-back none
          disable-animations: true
          script: chmod +x probe/pm-node && python3 -I tools/android-background-probe.py probe/app.apk probe/pm-node /tmp/bg
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: background-api${{ matrix.api }}-${{ matrix.target }}
          path: /tmp/bg
          retention-days: 7
