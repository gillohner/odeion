[package]
name = "pm-pubky"
description = "Pubky integration for the music node: social schemas, homeserver read/write, Pinakes and Nexus clients, discovery"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true


[dependencies]
pm-model = { workspace = true }
base32 = "0.5"
blake3 = { workspace = true }
bytes = { workspace = true }
futures-util = { workspace = true }
pubky = { workspace = true }
pubky-app-specs = { workspace = true }
pubky-music-specs = { workspace = true }
pm-appdata = { workspace = true }
pubky-social-specs = { workspace = true }
reqwest = { workspace = true, features = ["stream"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["io-util", "net"] }
tracing = { workspace = true }
url = { workspace = true }
zeroize = "1"

[dev-dependencies]
# A fake pkarr relay for the records tests
axum = { workspace = true }
# A homeserver over TLS on localhost for the public reads test
axum-server = { version = "0.8", features = ["tls-rustls"] }
rcgen = "0.14"
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs"] }
# A local HTTP relay for the Ring sign-ins of the vault test (the one pubky's own tests run),
# without its SQLite persistence (that would be a second libsqlite3)
http-relay = { version = "0.7", default-features = false, features = ["server"] }
# The vault client key must be the Noise static key pubky-noise derives from the same secret
pubky-noise = "=0.1.0"
tempfile = "3"
tokio = { workspace = true }
# The spec's v0-to-v1 transforms (what pubky-social-migrator runs), to check the node's own move
# writes the same paths (v1::tests::the_spec_migrator_writes_where_the_node_does). Tests only.
pubky-social-specs = { workspace = true, features = ["migrator"] }
