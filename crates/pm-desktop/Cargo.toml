[package]
name = "pm-desktop"
description = "The Odeion app: the node's web UI in a native window (desktop and Android), connected with Pubky Ring, with a built-in player"
version = "0.1.0"
edition = "2021"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/gillohner/pubky-music-node"

# Kept out of the workspace members: Tauri needs WebKitGTK on Linux, which the
# node's build machines do not have. CI and the release build it on their own
# (`npx @tauri-apps/cli build` in this directory; see README.md here).

[lib]
# Mobile builds load the app as a shared library; desktop links the rlib.
name = "pm_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }

[dependencies]
pm-model = { path = "../pm-model" }
pm-pubky = { path = "../pm-pubky" }
pm-offline = { path = "../pm-offline" }
pm-discovery = { path = "../pm-discovery" }
pm-remote = { path = "../pm-remote" }
# The page's own player played by the app (src/native.rs; Android uses it)
pm-app-player = { path = "../pm-app-player" }
tauri = { version = "=2.12.1", features = [] }
tauri-plugin-opener = "=2.7.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"

# The built-in player: bit-perfect ALSA `hw:` devices on Linux, the system
# output elsewhere (CoreAudio, WASAPI, AAudio on Android).
[target.'cfg(target_os = "linux")'.dependencies]
pm-stream = { path = "../pm-stream" }
pm-endpoint = { path = "../pm-endpoint", features = ["alsa", "cpal"] }

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
pm-stream = { path = "../pm-stream" }
pm-endpoint = { path = "../pm-endpoint", features = ["cpal"] }

# App updates (desktops; src/update.rs): the updater and its question.
[target.'cfg(any(target_os = "linux", target_os = "macos", target_os = "windows"))'.dependencies]
tauri-plugin-updater = "=2.13.1"
tauri-plugin-dialog = "=2.8.1"

# Android: the TLS platform verifier needs the JVM (see src/android.rs).
# Versions match what pkarr's reqwest resolves, so there is one verifier.
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.22"
# The webview hands over jni 0.21 objects (wry); used for the Wi-Fi multicast lock.
jni021 = { package = "jni", version = "0.21" }
rustls-platform-verifier = "0.7"
# The updater checks the APK it downloads (src/update_apk.rs).
sha2 = "0.10"
# The Ring transport probe (feature `ring-transport-probe`, src/ring_probe.rs).
pubky = { version = "0.16", optional = true }
# The media controls follow the node's zones on its /v1/events WebSocket (src/media_live.rs);
# plain ws:// only (the LAN, the tunnel), so no TLS of its own.
futures-util = "0.3"
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
pm-zones = { path = "../pm-zones" }
pm-stream = { path = "../pm-stream" }
pm-endpoint = { path = "../pm-endpoint", features = ["cpal"] }
# USB DACs: the report UsbAudio.kt hands over, parsed and kept for the phone's output (src/android.rs).
pm-out-local = { path = "../pm-out-local", features = ["cpal"] }

[dev-dependencies]
sha2 = "0.10"

[features]
# Android emulator CI only (.github/workflows/android.yml, ring transport): the app routes a
# fixture Pubky Ring grant exchange once at start and logs where it went. Never in releases.
ring-transport-probe = ["dep:pubky"]
# Android emulator CI only (.github/workflows/android.yml, update): the build reads its update feed
# from ODEION_UPDATE_FEED (plain http allowed) and logs a marker kept in the app's data. Never in releases.
update-feed-fixture = []

[profile.release]
lto = "thin"
codegen-units = 4
strip = "debuginfo"
