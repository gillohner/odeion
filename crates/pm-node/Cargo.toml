[package]
name = "pm-node"
description = "The Odeion node: the odeiond daemon (pm-node, its pre-Odeion name, is the same program)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
# `cargo run -p pm-node` runs odeiond (the package also builds pm-node)
default-run = "odeiond"

# The daemon. compat: pre-Odeion name: `pm-node` is the same program (src/bin/pm-node.rs), kept so
# scripts, units and images that run it keep working (docs/branding-compatibility.md).
[[bin]]
name = "odeiond"
path = "src/main.rs"

[[bin]]
name = "pm-node"
path = "src/bin/pm-node.rs"

[features]
default = []
alsa = ["pm-out-local/alsa"]

[dependencies]
pm-discovery = { workspace = true }
pm-renderer = { workspace = true }
pm-remote = { workspace = true }
pm-model = { workspace = true }
pm-zones = { workspace = true }
pm-out-local = { workspace = true }
pm-audio = { workspace = true }
pm-pubky = { workspace = true }
pm-library = { workspace = true }
pm-api = { workspace = true }
pm-out-net = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
qrcode = { version = "0.14", default-features = false }
rand = "0.8"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
tempfile = "3"
