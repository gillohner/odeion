[package]
name = "pm-out-local"
description = "Local outputs for the Odeion node: bit-perfect ALSA hw: (Linux), and a shared-mode cpal backend (CoreAudio, WASAPI, AAudio) for the app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = []
# Needs libasound2-dev at build time. Off by default so the workspace builds on machines
# without ALSA headers (this one); enable on the node: `--features pm-out-local/alsa`.
alsa = ["dep:alsa", "dep:alsa-sys"]
# Cross-platform shared-mode output (CoreAudio, WASAPI, ALSA) for desktops; not bit-perfect.
cpal = ["dep:cpal"]

[dependencies]
pm-model = { workspace = true }
pm-zones = { workspace = true }
pm-usb-audio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
alsa = { version = "0.11", optional = true }
alsa-sys = { version = "0.4", optional = true }
cpal = { version = "=0.18.2", optional = true }

[dev-dependencies]
pm-audio = { workspace = true }
# The phone's output through its endpoint, as the node reaches it (pm-endpoint without its
# pm-out-local feature: no cycle)
pm-endpoint = { workspace = true }
pm-out-net = { workspace = true }
pm-stream = { workspace = true }
tempfile = "3"
