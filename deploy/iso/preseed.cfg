#### Odeion installer: Debian 13 (trixie) with debian-installer, preseeded.
# Asked: the disk (with d-i's own "all data will be lost" confirmation), what to run (odeion/mode,
# odeion/ask-mode.sh), the hostname (default odeion), Wi-Fi when there is no cable, and the console
# password of the `odeion` user. Everything else is answered here. Booted with priority=high, so
# questions answered here are not asked; `seen false` below asks one with our default filled in.

### Language, keyboard, time
d-i debian-installer/locale string en_US.UTF-8
d-i keyboard-configuration/xkb-keymap select us
d-i time/zone string Etc/UTC
d-i clock-setup/utc boolean true
d-i clock-setup/ntp boolean true

### Network: DHCP; netcfg asks for Wi-Fi only when there is no cable
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string odeion
d-i netcfg/get_hostname seen false
d-i netcfg/get_domain string
d-i netcfg/hostname string odeion
d-i netcfg/wireless_wep string
d-i hw-detect/load_firmware boolean true

### What to run: our own question (odeion.templates), asked as soon as this file is read
d-i preseed/early_command string sh /cdrom/odeion/ask-mode.sh

### Mirror
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string
d-i apt-setup/services-select multiselect security, updates
d-i apt-setup/non-free-firmware boolean true

### Accounts: no root login (sudo), one user `odeion` whose password is asked
d-i passwd/root-login boolean false
d-i passwd/make-user boolean true
d-i passwd/user-fullname string Odeion
d-i passwd/username string odeion
d-i passwd/user-default-groups string audio sudo

### Disk: the whole disk the owner picks, ext4 with swap. Not preseeded: the disk itself
### (partman-auto/disk) and the final "write the changes to disk?" confirmation.
d-i partman-auto/method string regular
d-i partman-auto/choose_recipe select atomic
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-md/device_remove_md boolean true
d-i partman-lvm/confirm boolean true
d-i partman-lvm/confirm_nooverwrite boolean true
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/mount_style select uuid
d-i partman-efi/non_efi_system boolean true

### Packages: a small system, no desktop, no SSH server
tasksel tasksel/first multiselect standard
d-i pkgsel/include string docker.io docker-compose avahi-daemon libnss-mdns nftables unattended-upgrades apt-listchanges curl ca-certificates openssl
d-i pkgsel/upgrade select full-upgrade
d-i pkgsel/update-policy select unattended-upgrades
popularity-contest popularity-contest/participate boolean false
d-i apt-setup/cdrom/set-first boolean false
d-i apt-setup/cdrom/set-next boolean false
d-i apt-setup/cdrom/set-failed boolean false
d-i apt-setup/disable-cdrom-entries boolean true

### Boot loader on the disk installed to
d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean true
d-i grub-installer/bootdev string default

### Odeion itself (odeion/late.sh), then reboot into it
d-i preseed/late_command string sh /cdrom/odeion/late.sh
d-i finish-install/reboot_in_progress note
d-i cdrom-detect/eject boolean true
