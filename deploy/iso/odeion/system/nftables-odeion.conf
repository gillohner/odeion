# Odeion: stopping or restarting nftables takes away only Odeion's firewall table. Debian's unit
# runs `nft flush ruleset` on stop, which also deleted Docker's rules (its containers lost their
# network). The local redirect's table stays too: odeion-local-redirect owns it.
[Service]
ExecStop=
ExecStop=-/usr/sbin/nft delete table inet odeion
