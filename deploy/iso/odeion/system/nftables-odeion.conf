# Odeion: stopping or restarting nftables takes away only Odeion's tables. Debian's unit runs
# `nft flush ruleset` on stop, which also deleted Docker's rules (its containers lost their network).
[Service]
ExecStop=
ExecStop=-/usr/sbin/nft delete table inet odeion
ExecStop=-/usr/sbin/nft delete table ip odeion_redirect
